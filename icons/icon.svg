<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6ddf14"/>
      <stop offset="100%" style="stop-color:#3a9e01"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <!-- 书本图标 -->
  <g transform="translate(128, 120)" fill="white">
    <!-- 左页 -->
    <path d="M20,40 C20,40 60,20 128,20 L128,240 C60,240 20,220 20,220 Z" fill="white" opacity="0.95"/>
    <!-- 右页 -->
    <path d="M236,40 C236,40 196,20 128,20 L128,240 C196,240 236,220 236,220 Z" fill="white" opacity="0.85"/>
    <!-- 书脊 -->
    <rect x="124" y="16" width="8" height="230" rx="4" fill="rgba(0,0,0,0.1)"/>
    <!-- 文字线条 -->
    <rect x="50" y="70" width="50" height="6" rx="3" fill="#58cc02" opacity="0.6"/>
    <rect x="50" y="95" width="40" height="6" rx="3" fill="#58cc02" opacity="0.4"/>
    <rect x="50" y="120" width="55" height="6" rx="3" fill="#58cc02" opacity="0.6"/>
    <rect x="155" y="70" width="50" height="6" rx="3" fill="#58cc02" opacity="0.5"/>
    <rect x="155" y="95" width="45" height="6" rx="3" fill="#58cc02" opacity="0.4"/>
    <rect x="155" y="120" width="50" height="6" rx="3" fill="#58cc02" opacity="0.5"/>
  </g>
  <!-- "L" 字母标识 -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" opacity="0.9">L</text>
</svg>
